{% extends "layout.html" %} 
{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Duelist Deck ของฉัน</h2>
        <a href="{{ url_for('core.add_card') }}" class="btn btn-success">+ เพิ่มการ์ดใหม่</a>
    </div>

    <form action="{{ url_for('core.index') }}" method="GET" class="mb-4">
        <div class="input-group">
            <input type="text" name="q" class="form-control" placeholder="ค้นหาชื่อการ์ด..." value="{{ request.args.get('q', '') }}">
            <button class="btn btn-primary" type="submit">ค้นหา</button>
        </div>
    </form>

    <div class="row">
        {% for card in cards %}
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title text-primary">{{ card.name }}</h5>
                    <p class="card-text">
                        <span class="badge bg-secondary">{{ card.card_type }}</span>
                        <span class="badge bg-info text-dark">{{ card.attribute }}</span>
                    </p>
                    <p class="card-text text-truncate">{{ card.description }}</p>
                    <hr>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('core.edit_card', id=card.id) }}" class="btn btn-sm btn-warning">แก้ไข</a>
                        <a href="{{ url_for('core.delete_card', id=card.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('ยืนยันการลบการ์ดใบนี้?')">ลบ</a>
                    </div>
                </div>
            </div>
        </div>
        {% else %}
        <div class="col-12 text-center">
            <p class="text-muted">ยังไม่มีการ์ดในเด็ค หรือไม่พบข้อมูลที่ค้นหา</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
